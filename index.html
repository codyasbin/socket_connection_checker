<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Socket Connection Checker</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: white;
            border-radius: 12px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 100%;
            max-width: 800px;
            overflow: hidden;
        }

        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            text-align: center;
        }

        .header h1 {
            font-size: 28px;
            margin-bottom: 10px;
        }

        .status-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px 20px;
            background: #f5f5f5;
            border-bottom: 1px solid #e0e0e0;
        }

        .status-info {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .status-dot {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            background: #ff6b6b;
            animation: blink 2s infinite;
            flex-shrink: 0;
        }

        .status-dot.connected {
            background: #51cf66;
            animation: none;
        }

        @keyframes blink {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .status-text {
            font-size: 14px;
            font-weight: 500;
            color: #333;
        }

        .socket-url {
            font-size: 12px;
            color: #666;
            font-family: 'Courier New', monospace;
            background: #f0f0f0;
            padding: 5px 10px;
            border-radius: 4px;
            word-break: break-all;
        }

        .content {
            padding: 20px;
        }

        .section {
            margin-bottom: 20px;
        }

        .section-title {
            font-size: 14px;
            font-weight: 600;
            color: #333;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .url-input-row {
            display: flex;
            gap: 10px;
            margin-bottom: 10px;
        }

        .url-input-row input[type="text"] {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
        }

        .url-input-row input[type="text"]:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .url-input-row input[type="text"]:disabled {
            background: #f5f5f5;
            color: #999;
        }

        .url-presets {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            margin-bottom: 15px;
        }

        .url-preset-btn {
            padding: 6px 10px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 11px;
            color: #555;
            transition: all 0.2s ease;
        }

        .url-preset-btn:hover {
            background: #e0e0e0;
            border-color: #999;
        }

        .validation-msg {
            font-size: 12px;
            margin-bottom: 10px;
            min-height: 16px;
        }

        .validation-msg.error {
            color: #c62828;
        }

        .validation-msg.ok {
            color: #2e7d32;
        }

        .messages-area {
            background: #f9f9f9;
            border: 1px solid #e0e0e0;
            border-radius: 8px;
            height: 300px;
            overflow-y: auto;
            padding: 15px;
            margin-bottom: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }

        .message {
            margin-bottom: 10px;
            padding: 8px;
            border-radius: 4px;
            word-break: break-word;
        }

        .message.received {
            background: #e3f2fd;
            border-left: 3px solid #2196f3;
            color: #1565c0;
        }

        .message.sent {
            background: #f0f4c3;
            border-left: 3px solid #fbc02d;
            color: #827717;
        }

        .message.system {
            background: #f3e5f5;
            border-left: 3px solid #9c27b0;
            color: #6a1b9a;
            font-style: italic;
        }

        .message.error {
            background: #ffebee;
            border-left: 3px solid #f44336;
            color: #c62828;
        }

        .message-time {
            font-size: 10px;
            opacity: 0.6;
        }

        .input-group {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }

        .input-group textarea {
            flex: 1;
            padding: 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-family: 'Courier New', monospace;
            font-size: 13px;
            resize: vertical;
            min-height: 60px;
            max-height: 120px;
        }

        .input-group textarea:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }

        .button-group {
            display: flex;
            flex-direction: column;
            gap: 10px;
            justify-content: flex-start;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 13px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .btn-send {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }

        .btn-send:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(102, 126, 234, 0.3);
        }

        .btn-send:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-connect {
            background: #51cf66;
            color: white;
        }

        .btn-connect:hover:not(:disabled) {
            background: #40c057;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(81, 207, 102, 0.3);
        }

        .btn-connect:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }

        .btn-disconnect {
            background: #ff6b6b;
            color: white;
        }

        .btn-disconnect:hover:not(:disabled) {
            background: #fa5252;
            transform: translateY(-2px);
            box-shadow: 0 10px 20px rgba(255, 107, 107, 0.3);
        }

        .btn-clear {
            background: #a6a6a6;
            color: white;
        }

        .btn-clear:hover {
            background: #919191;
            transform: translateY(-2px);
        }

        .action-buttons {
            display: flex;
            gap: 10px;
            margin-top: 10px;
        }

        .action-buttons button {
            flex: 1;
            padding: 10px;
            font-size: 12px;
        }

        .preset-messages {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 15px;
        }

        .preset-btn {
            padding: 10px;
            background: #f0f0f0;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s ease;
        }

        .preset-btn:hover {
            background: #e0e0e0;
            border-color: #999;
        }

        @media (max-width: 600px) {
            .header h1 {
                font-size: 20px;
            }

            .messages-area {
                height: 200px;
            }

            .preset-messages {
                grid-template-columns: 1fr;
            }

            .status-bar {
                flex-direction: column;
                gap: 10px;
                align-items: flex-start;
            }

            .url-input-row {
                flex-direction: column;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔌 Socket Connection Checker</h1>
        </div>

        <div class="status-bar">
            <div class="status-info">
                <div class="status-dot" id="statusDot"></div>
                <div>
                    <div class="status-text">Status: <strong id="statusText">Disconnected</strong></div>
                    <div class="socket-url" id="socketUrl"></div>
                </div>
            </div>
        </div>

        <div class="content">
            <!-- URL Section -->
            <div class="section">
                <div class="section-title">🔗 Socket URL</div>
                <div class="url-input-row">
                    <input type="text" id="urlInput" placeholder="ws://localhost:8001/api/v1/order-requests/ws?tenant_slug=test&branch_id=1" value="ws://localhost:8001/api/v1/order-requests/ws?tenant_slug=test&branch_id=1">
                </div>
                <div class="url-presets">
                    <button class="url-preset-btn" onclick="setUrl('ws://localhost:8001/api/v1/order-requests/ws?tenant_slug=test&branch_id=1')">Local Dev</button>
                    <button class="url-preset-btn" onclick="setUrl('ws://localhost:8000/ws')">Local :8000/ws</button>
                    <button class="url-preset-btn" onclick="setUrl('wss://echo.websocket.org')">Public Echo Test</button>
                </div>
                <div class="validation-msg" id="validationMsg"></div>
            </div>

            <!-- Messages Section -->
            <div class="section">
                <div class="section-title">📨 Messages</div>
                <div class="messages-area" id="messagesArea"></div>
            </div>

            <!-- Connection Controls -->
            <div class="section">
                <div class="section-title">🎮 Controls</div>
                <div class="action-buttons">
                    <button class="btn-connect" id="connectBtn" onclick="connectSocket()">Connect</button>
                    <button class="btn-disconnect" id="disconnectBtn" onclick="disconnectSocket()" disabled>Disconnect</button>
                    <button class="btn-clear" onclick="clearMessages()">Clear</button>
                </div>
            </div>

            <!-- Send Message Section -->
            <div class="section">
                <div class="section-title">✉️ Send Message</div>
                <div class="preset-messages">
                    <button class="preset-btn" onclick="sendPreset('Hello Server!')">Hello Server!</button>
                    <button class="preset-btn" onclick='sendPreset("{\"type\":\"ping\"}")'>JSON Ping</button>
                    <button class="preset-btn" onclick='sendPreset("{\"action\":\"test\",\"data\":\"123\"}")'>Test Action</button>
                    <button class="preset-btn" onclick="sendPreset('Timestamp: ' + new Date().toISOString())">Timestamp</button>
                </div>
                <div class="input-group">
                    <textarea id="messageInput" placeholder="Enter your message here..." disabled></textarea>
                    <div class="button-group">
                        <button class="btn-send" id="sendBtn" onclick="sendMessage()" disabled>Send</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let socket = null;

        // DOM Elements
        const urlInput = document.getElementById('urlInput');
        const validationMsg = document.getElementById('validationMsg');
        const messagesArea = document.getElementById('messagesArea');
        const messageInput = document.getElementById('messageInput');
        const sendBtn = document.getElementById('sendBtn');
        const connectBtn = document.getElementById('connectBtn');
        const disconnectBtn = document.getElementById('disconnectBtn');
        const statusDot = document.getElementById('statusDot');
        const statusText = document.getElementById('statusText');
        const socketUrlEl = document.getElementById('socketUrl');

        function log(message, type = 'system') {
            const timestamp = new Date().toLocaleTimeString();
            const messageEl = document.createElement('div');
            messageEl.className = `message ${type}`;
            messageEl.innerHTML = `<div class="message-time">[${timestamp}]</div>${escapeHtml(message)}`;
            messagesArea.appendChild(messageEl);
            messagesArea.scrollTop = messagesArea.scrollHeight;
        }

        function escapeHtml(text) {
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return text.replace(/[&<>"']/g, m => map[m]);
        }

        function setUrl(url) {
            urlInput.value = url;
            validateUrl();
        }

        function validateUrl() {
            const url = urlInput.value.trim();
            if (!url) {
                validationMsg.textContent = '';
                validationMsg.className = 'validation-msg';
                return false;
            }
            if (!/^wss?:\/\//i.test(url)) {
                validationMsg.textContent = '⚠️ URL must start with ws:// or wss://';
                validationMsg.className = 'validation-msg error';
                return false;
            }
            try {
                new URL(url);
            } catch (e) {
                validationMsg.textContent = '⚠️ Invalid URL format';
                validationMsg.className = 'validation-msg error';
                return false;
            }
            validationMsg.textContent = '✓ Valid WebSocket URL';
            validationMsg.className = 'validation-msg ok';
            return true;
        }

        urlInput.addEventListener('input', validateUrl);
        validateUrl();

        function updateStatus(connected, connecting = false) {
            if (connected) {
                statusDot.classList.add('connected');
                statusText.textContent = 'Connected ✓';
                messageInput.disabled = false;
                sendBtn.disabled = false;
                connectBtn.disabled = true;
                disconnectBtn.disabled = false;
                urlInput.disabled = true;
                socketUrlEl.textContent = `Connected to: ${urlInput.value.trim()}`;
            } else {
                statusDot.classList.remove('connected');
                statusText.textContent = connecting ? 'Connecting…' : 'Disconnected ✗';
                messageInput.disabled = true;
                sendBtn.disabled = true;
                connectBtn.disabled = connecting;
                disconnectBtn.disabled = !connecting;
                urlInput.disabled = connecting;
                if (!connecting) socketUrlEl.textContent = '';
            }
        }

        function connectSocket() {
            if (socket && socket.readyState === WebSocket.OPEN) {
                log('Already connected!', 'system');
                return;
            }

            const url = urlInput.value.trim();

            if (!validateUrl()) {
                log('✗ Please enter a valid ws:// or wss:// URL before connecting', 'error');
                return;
            }

            try {
                updateStatus(false, true);
                socket = new WebSocket(url);

                socket.onopen = () => {
                    log(`✓ Connected to socket successfully! (${url})`, 'system');
                    updateStatus(true);
                };

                socket.onmessage = (event) => {
                    log(`Received: ${event.data}`, 'received');
                };

                socket.onerror = (error) => {
                    log(`✗ Socket error: ${error.message || 'Unknown error (check console / URL / server)'}`, 'error');
                };

                socket.onclose = (event) => {
                    log(`✗ Socket connection closed (code: ${event.code}${event.reason ? ', reason: ' + event.reason : ''})`, 'system');
                    updateStatus(false);
                };
            } catch (error) {
                log(`✗ Connection failed: ${error.message}`, 'error');
                updateStatus(false);
            }
        }

        function disconnectSocket() {
            if (socket) {
                socket.close();
                socket = null;
            }
        }

        function sendMessage() {
            const message = messageInput.value.trim();
            if (!message) {
                log('⚠️ Please enter a message', 'system');
                return;
            }

            if (!socket || socket.readyState !== WebSocket.OPEN) {
                log('✗ Socket is not connected', 'error');
                return;
            }

            try {
                socket.send(message);
                log(`Sent: ${message}`, 'sent');
                messageInput.value = '';
            } catch (error) {
                log(`✗ Failed to send: ${error.message}`, 'error');
            }
        }

        function sendPreset(message) {
            if (!socket || socket.readyState !== WebSocket.OPEN) {
                log('✗ Socket is not connected', 'error');
                return;
            }

            try {
                socket.send(message);
                log(`Sent: ${message}`, 'sent');
            } catch (error) {
                log(`✗ Failed to send: ${error.message}`, 'error');
            }
        }

        function clearMessages() {
            messagesArea.innerHTML = '';
        }

        // Allow Enter key to send message
        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                sendMessage();
            }
        });

        // Allow Enter key in URL field to connect
        urlInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                e.preventDefault();
                connectSocket();
            }
        });

        // Initial log
        log('💡 Tip: Enter a WebSocket URL above (or pick a preset) and click "Connect"', 'system');
    </script>
</body>
</html>
